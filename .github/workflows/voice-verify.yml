# Listens to every recorded count with speech recognition (faster-whisper) and lists the
# clips that don't sound like their number (e.g. two counts stuck together).
name: 구령 음성 검사

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/voice-verify.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install --quiet faster-whisper
      - name: Transcribe all counts
        run: |
          python - <<'PY'
          import re, subprocess, numpy as np
          from faster_whisper import WhisperModel
          NATIVE = ['하나','둘','셋','넷','다섯','여섯','일곱','여덟','아홉','열','열하나','열둘','열셋','열넷','열다섯','열여섯','열일곱','열여덟','열아홉','스물']
          TENS = ['', '열', '스물', '서른', '마흔', '쉰', '예순', '일흔', '여든', '아흔']
          ONES = ['', '하나', '둘', '셋', '넷', '다섯', '여섯', '일곱', '여덟', '아홉']
          def ko(n):
              if n <= 20: return NATIVE[n-1]
              if n < 100: return TENS[n//10] + ONES[n%10]
              if n == 100: return '백'
              if n < 200: return '백' + ko(n-100)
              return '이백'
          def load(path):
              raw = subprocess.run(["ffmpeg", "-loglevel", "error", "-i", path, "-ac", "1", "-ar", "16000", "-f", "f32le", "-"], capture_output=True).stdout
              return np.frombuffer(raw, dtype=np.float32)
          ALIAS = {"신": "쉰", "심": "쉰", "씬": "쉰", "택": "백", "댁": "백", "빽": "백", "배": "백"}
          def norm(t):
              t = re.sub(r"[^0-9가-힣]", "", t).replace("이른", "일흔")
              return "".join(ALIAS.get(c, c) for c in t)
          import difflib
          WORDS = {ko(m): m for m in range(1, 201)}
          def jamo(t):
              out = []
              for c in t:
                  o = ord(c) - 0xAC00
                  if 0 <= o < 11172:
                      out += [chr(0x1100 + o // 588), chr(0x1161 + (o % 588) // 28)] + ([chr(0x11A7 + o % 28)] if o % 28 else [])
                  else:
                      out.append(c)
              return "".join(out)
          def judge(n, h):
              # Digits count as the word; a close spelling passes unless it's nearer another number.
              h = re.sub(r"\d+", lambda m: ko(int(m.group())) if 1 <= int(m.group()) <= 200 else m.group(), h)
              if h == ko(n): return True
              if h in WORDS: return False
              sim = lambda m: difflib.SequenceMatcher(None, jamo(h), jamo(ko(m))).ratio()
              return sim(n) >= 0.7 and max(range(1, 201), key=sim) == n
          asr = WhisperModel("medium", device="cpu", compute_type="int8")
          rows, bad = [], []
          import os
          for n in range(1, 201):
              if not os.path.exists(f"mobile/assets/voice/count-{n:03d}.m4a"):
                  rows.append(f"{n}\t{ko(n)}\t-\tsystem-voice\t0"); continue
              y = load(f"mobile/assets/voice/count-{n:03d}.m4a")
              y = np.concatenate([np.zeros(4000, np.float32), y, np.zeros(4000, np.float32)])
              segs, _ = asr.transcribe(y, language="ko", beam_size=5, vad_filter=False)
              heard = norm("".join(s.text for s in segs))
              ok = judge(n, heard)
              rows.append(f"{n}\t{ko(n)}\t{heard}\t{'ok' if ok else 'CHECK'}\t{len(y)/16000:.2f}")
              if not ok: bad.append(n)
              print(rows[-1], flush=True)
          open("voice-samples/verify.tsv", "w").write("\n".join(rows) + "\n")
          open("voice-samples/verify-bad.txt", "w").write(",".join(map(str, bad)) + "\n")
          print("CHECK:", len(bad), bad)
          PY
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voice-samples/verify.tsv voice-samples/verify-bad.txt
          git diff --cached --quiet && exit 0
          git commit -m "Voice count check report [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
