# Korean counting samples in a deep male voice, cloned with open-source models:
#   - reference voices: Zeroth Korean speech corpus (CC BY 4.0), lowest-pitched speakers
#   - Chatterbox Multilingual (MIT) zero-shot voice cloning
# Results are committed to voice-samples/.
name: 남자 목소리 샘플 (오픈소스 복제)

concurrency:
  group: voice-clone
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      text:
        description: '읽을 문장'
        default: '하나! 둘! 셋! 넷! 다섯!'
  push:
    branches: [main]
    paths:
      - '.github/workflows/voice-clone.yml'

permissions:
  contents: write

jobs:
  clone:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install --quiet torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet chatterbox-tts
          # chatterbox pins numpy 1.x: keep pyarrow/datasets on versions built for it
          pip install --quiet "pyarrow==17.0.0" "datasets<4" soundfile librosa
      - name: Pick deep male reference voices (Zeroth Korean, CC BY 4.0)
        run: |
          mkdir -p refs
          python - <<'PY'
          import json, numpy as np, soundfile as sf, librosa
          from datasets import load_dataset, Audio
          ds = load_dataset("kresnik/zeroth_korean", split="train", streaming=True)
          ds = ds.cast_column("audio", Audio(sampling_rate=24000))
          by_spk = {}
          for i, row in enumerate(ds):
              spk = str(row.get("speaker_id", row.get("id", i)))
              clips = by_spk.setdefault(spk, [])
              if len(clips) < 4:
                  clips.append(np.asarray(row["audio"]["array"], dtype=np.float32))
              if len(by_spk) >= 40 and all(len(c) >= 4 for c in list(by_spk.values())[:40]):
                  break
              if i > 6000:
                  break
          stats = []
          for spk, clips in by_spk.items():
              if len(clips) < 3:
                  continue
              y = np.concatenate(clips[:3])
              f0 = librosa.yin(y, fmin=60, fmax=300, sr=24000)
              med = float(np.median(f0))
              stats.append((med, spk))
          stats.sort()
          print("lowest median F0 speakers:", stats[:8])
          chosen = []
          for med, spk in stats:
              if med < 70:  # likely noise / tracking failure
                  continue
              y = np.concatenate(by_spk[spk][:4])
              y = y[: 24000 * 14]
              y = y / (np.abs(y).max() + 1e-6) * 0.9
              sf.write(f"refs/ref_{spk}.wav", y, 24000)
              chosen.append({"speaker": spk, "median_f0": med})
              if len(chosen) == 3:
                  break
          json.dump(chosen, open("refs/chosen.json", "w"), indent=2)
          print(chosen)
          PY
      - name: Generate with Chatterbox Multilingual
        env:
          TEXT: ${{ inputs.text || '하나! 둘! 셋! 넷! 다섯!' }}
        run: |
          mkdir -p out
          python - <<'PY'
          import os, json, torchaudio
          from chatterbox.mtl_tts import ChatterboxMultilingualTTS
          model = ChatterboxMultilingualTTS.from_pretrained(device="cpu")
          text = os.environ["TEXT"]
          for c in json.load(open("refs/chosen.json")):
              ref = f"refs/ref_{c['speaker']}.wav"
              for ex in (0.5, 0.8):
                  wav = model.generate(text, language_id="ko", audio_prompt_path=ref, exaggeration=ex, cfg_weight=0.4)
                  torchaudio.save(f"out/male-{c['speaker']}-energy{ex}.wav", wav, model.sr)
          PY
          for f in out/*.wav; do ffmpeg -loglevel error -y -i "$f" -b:a 96k "${f%.wav}.mp3"; done
          ls -la out
      - name: Commit samples
        run: |
          mkdir -p voice-samples
          cp out/*.mp3 voice-samples/
          cp refs/chosen.json voice-samples/male-refs.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voice-samples
          git diff --cached --quiet && exit 0
          git commit -m "Male voice samples (Chatterbox, Zeroth refs) [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
