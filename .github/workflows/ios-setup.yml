# One-time setup: create the EAS project and iOS signing credentials.
# Run it once from the Actions tab (Run workflow) after adding the secrets in docs/IOS_TESTFLIGHT.md.
name: iOS 1회 설정 (EAS)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-eas
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      EXPO_APPLE_TEAM_TYPE: ${{ vars.APPLE_TEAM_TYPE || 'INDIVIDUAL' }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          missing=""
          for v in EXPO_TOKEN EXPO_ASC_KEY_ID EXPO_ASC_ISSUER_ID EXPO_APPLE_TEAM_ID; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          [ -n "$ASC_KEY_P8" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then
            echo "::error::GitHub secrets missing:$missing (see docs/IOS_TESTFLIGHT.md)"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      - name: Write App Store Connect API key
        run: |
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc_key.p8"
          echo "EXPO_ASC_API_KEY_PATH=$RUNNER_TEMP/asc_key.p8" >> "$GITHUB_ENV"

      - name: Link EAS project (writes projectId to app.json)
        run: npx eas-cli init --non-interactive --force

      - name: Create iOS distribution certificate and provisioning profile
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq expect
          env -u CI expect scripts/eas-ios-credentials.exp

      - name: Commit EAS project id
        run: |
          if git diff --quiet -- app.json; then
            echo "app.json unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app.json
            git commit -m "Link EAS project"
            git push
          fi
