# Build the iOS app on EAS and upload it to TestFlight.
# Run from the Actions tab (Run workflow), or push a tag like ios-v0.1.0.
name: iOS TestFlight 배포

on:
  workflow_dispatch:
  push:
    tags:
      - 'ios-v*'

permissions:
  contents: read

concurrency:
  group: ios-eas
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      EXPO_APPLE_TEAM_TYPE: ${{ vars.APPLE_TEAM_TYPE || 'INDIVIDUAL' }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      ASC_APP_ID: ${{ vars.ASC_APP_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check setup
        run: |
          if ! jq -e '.expo.extra.eas.projectId' app.json >/dev/null; then
            echo "::error::EAS project is not linked yet. Run the 'iOS 1회 설정 (EAS)' workflow first."
            exit 1
          fi
          if [ -z "$ASC_APP_ID" ]; then
            echo "::error::Repository variable ASC_APP_ID is missing (App Store Connect > 앱 > 앱 정보 > Apple ID). See docs/IOS_TESTFLIGHT.md"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Write App Store Connect API key
        run: |
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc_key.p8"
          echo "EXPO_ASC_API_KEY_PATH=$RUNNER_TEMP/asc_key.p8" >> "$GITHUB_ENV"

      - name: Build on EAS (iOS, production)
        run: npx eas-cli build --platform ios --profile production --non-interactive

      - name: Add TestFlight submit profile
        run: |
          jq --arg app "$ASC_APP_ID" --arg path "$RUNNER_TEMP/asc_key.p8" \
             --arg kid "$EXPO_ASC_KEY_ID" --arg iss "$EXPO_ASC_ISSUER_ID" \
             '.submit.production.ios = {ascAppId: $app, ascApiKeyPath: $path, ascApiKeyId: $kid, ascApiKeyIssuerId: $iss}' \
             eas.json > eas.tmp.json && mv eas.tmp.json eas.json

      - name: Upload to TestFlight
        run: npx eas-cli submit --platform ios --profile production --latest --non-interactive
