# Records the rep counts 1-200 in the chosen voice and adds them to the app:
#   reference: Zeroth Korean speaker 116 (CC BY 4.0), cloned with Chatterbox Multilingual (MIT)
# Output: mobile/assets/voice/count-NNN.m4a + mobile/src/features/voice/counts.ts
name: 구령 음성 만들기 (1~200)

concurrency:
  group: voice-counts
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      only:
        description: '다시 만들 숫자 (쉼표로 구분, 비우면 전부)'
        default: ''
      repeat:
        description: '한 숫자씩 여러 번 반복해서 녹음 (짧은 단어용)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/voice-counts.yml'

permissions:
  contents: write

env:
  SPEAKER: '116'
  EXAGGERATION: '0.8'
  # Numbers to redo (only their groups are re-recorded and only these files replaced).
  ONLY_INPUT: ${{ inputs.only }}
  REPEAT: ${{ inputs.repeat && '1' || '' }}

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/checkout@v4
        with:
          path: repo
      - name: Which counts to redo
        run: |
          ONLY="$ONLY_INPUT"
          # By default redo the counts that have no clip yet (removed because they failed).
          if [ -z "$ONLY" ]; then
            for n in $(seq 1 200); do
              [ -f "repo/mobile/assets/voice/$(printf 'count-%03d.m4a' "$n")" ] || ONLY="$ONLY$n,"
            done
            ONLY="${ONLY%,}"
          fi
          if [ -z "$ONLY" ]; then echo "Nothing to redo"; ONLY=0; fi
          echo "ONLY=$ONLY" >> "$GITHUB_ENV"
          echo "Redo: ${ONLY:-all}"
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install --quiet faster-whisper
          pip install --quiet torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet chatterbox-tts
          pip install --quiet "pyarrow==17.0.0" "datasets<4" soundfile librosa
      - name: Reference voice
        run: |
          cat > ref.py <<'PY'
          import os, numpy as np, soundfile as sf
          from datasets import load_dataset, Audio
          want = os.environ["SPEAKER"]
          ds = load_dataset("kresnik/zeroth_korean", split="train", streaming=True)
          ds = ds.cast_column("audio", Audio(sampling_rate=24000))
          clips = []
          for i, row in enumerate(ds):
              if str(row.get("speaker_id", "")) == want:
                  clips.append(np.asarray(row["audio"]["array"], dtype=np.float32))
                  if len(clips) == 4:
                      break
              if i > 20000:
                  break
          y = np.concatenate(clips)[: 24000 * 14]
          y = y / (np.abs(y).max() + 1e-6) * 0.9
          sf.write("ref.wav", y, 24000)
          print("reference clips:", len(clips))
          PY
          # Streaming the corpus occasionally aborts; try a few times.
          for i in 1 2 3; do python ref.py && break; sleep 10; done
          test -f ref.wav
      - name: Record in groups of ten and split into single counts
        env:
          PART: ${{ matrix.part }}
        run: |
          mkdir -p out
          python - <<'PY'
          # Saying one word alone makes the model ramble; a run of counts ("하나! 둘! … 열!")
          # comes out clean, like the sample that was picked. Record ten at a time and cut
          # at the pauses; each piece is kept only if Whisper hears the right number.
          import os, torch, numpy as np, librosa, soundfile as sf
          from chatterbox.mtl_tts import ChatterboxMultilingualTTS
          NATIVE = ['하나','둘','셋','넷','다섯','여섯','일곱','여덟','아홉','열','열하나','열둘','열셋','열넷','열다섯','열여섯','열일곱','열여덟','열아홉','스물']
          TENS = ['', '열', '스물', '서른', '마흔', '쉰', '예순', '일흔', '여든', '아흔']
          ONES = ['', '하나', '둘', '셋', '넷', '다섯', '여섯', '일곱', '여덟', '아홉']
          def ko(n):
              if n <= 20: return NATIVE[n-1]
              if n < 100: return TENS[n//10] + ONES[n%10]
              if n == 100: return '백'
              if n < 200: return '백' + ko(n-100)
              return '이백'
          def pieces(y, sr):
              iv = librosa.effects.split(y, top_db=30, frame_length=1024, hop_length=256)
              merged = []
              for a, b in iv:
                  # Short gaps are inside a word (백…하나); the pauses between counts are longer.
                  if merged and a - merged[-1][1] < int(0.2 * sr):
                      merged[-1][1] = b
                  else:
                      merged.append([a, b])
              return [m for m in merged if m[1] - m[0] > int(0.12 * sr)]
          part = int(os.environ["PART"])
          tts = ChatterboxMultilingualTTS.from_pretrained(device="cpu")
          from faster_whisper import WhisperModel
          import re
          asr = WhisperModel("medium", device="cpu", compute_type="int8")
          # Whisper often writes 쉰 as 신/심 and 백 as 택/댁; those are still the right word.
          ALIAS = {"신": "쉰", "심": "쉰", "씬": "쉰", "택": "백", "댁": "백", "빽": "백", "배": "백"}
          def norm(t):
              t = re.sub(r"[^0-9가-힣]", "", t)
              return "".join(ALIAS.get(c, c) for c in t)
          pad = int(0.03 * 24000)
          ex = float(os.environ["EXAGGERATION"])
          groups = [list(range(s, min(s + 10, 201))) for s in range(1, 201, 10)]
          only = {int(x) for x in os.environ.get("ONLY", "").split(",") if x.strip()}
          if only:
              groups = [g for g in groups if only & set(g)]
          if only and os.environ.get("REPEAT"):
              # One number said several times ("넷! ... 넷! ... 넷!"): any clean piece will do.
              groups = [[n] for n in sorted(only)]
          def good(n, sec):
              return 0.18 <= sec <= max(1.2, 0.35 + 0.17 * len(ko(n)))
          report = []
          for gi, nums in enumerate(groups):
              if gi % 8 != part:
                  continue
              targets = [n for n in nums if not only or n in only]
              # Clear pauses between counts so short words don't stick together.
              text = " ... ".join(f"{ko(n)}!" for n in (nums * 6 if len(nums) == 1 else nums))
              # Keep every correctly heard piece from any take, so a number only needs to come
              # out right once. Pieces are matched by what Whisper hears, in order, so an extra
              # breath or two counts stuck together don't shift the rest.
              best = {}
              expect = {norm(ko(n)): n for n in nums}
              expect.update({str(n): n for n in nums})
              for attempt in range(12):
                  torch.manual_seed(3000 + attempt)
                  y = tts.generate(text, language_id="ko", audio_prompt_path="ref.wav", exaggeration=ex, cfg_weight=0.4).squeeze(0).numpy()
                  segs = pieces(y, tts.sr) or []
                  heard_all = []
                  for a, b in segs:
                      clip = y[max(0, a - pad): b + pad]
                      y16 = librosa.resample(clip, orig_sr=tts.sr, target_sr=16000)
                      y16 = np.concatenate([np.zeros(4000, np.float32), y16.astype(np.float32), np.zeros(4000, np.float32)])
                      out, _ = asr.transcribe(y16, language="ko", beam_size=5, vad_filter=False)
                      heard = norm("".join(x.text for x in out))
                      heard_all.append(heard)
                      n = expect.get(heard)
                      if n is None or n not in targets or n in best or not good(n, (b - a) / tts.sr):
                          continue
                      best[n] = clip
                  print("  take", attempt, len(segs), "pieces:", " ".join(heard_all), "| have", len(best), "/", len(targets), flush=True)
                  if len(best) == len(targets):
                      break
              for n, clip in best.items():
                  sf.write(f"out/count-{n:03d}.wav", clip, tts.sr)
                  report.append(f"{n}\t{ko(n)}\tverified")
              missing = [n for n in targets if n not in best]
              for n in missing:
                  report.append(f"{n}\t{ko(n)}\tFAILED")
              print(nums[0], "-", nums[-1], "verified", len(best), "/", len(targets), flush=True)
          open(f"out/report-{part}.tsv", "w").write("\n".join(report) + "\n")
          PY
      - name: Trim and encode
        run: |
          for f in out/*.wav; do
            ffmpeg -loglevel error -y -i "$f" -af "loudnorm=I=-14:TP=-1" -ac 1 -ar 24000 -c:a aac -b:a 64k "${f%.wav}.m4a"
          done
          ls out/*.m4a | wc -l
          grep -c FAILED out/report-*.tsv || true
      - uses: actions/upload-artifact@v4
        with:
          name: counts-${{ matrix.part }}
          path: |
            out/*.m4a
            out/report-*.tsv

  commit:
    needs: record
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: mobile/assets/voice
          pattern: counts-*
          merge-multiple: true
      - name: Write counts.ts and commit
        run: |
          mkdir -p voice-samples
          mv mobile/assets/voice/report-*.tsv voice-samples/ 2>/dev/null || true
          # A clip that still doesn't pass is removed: the app then says that number with the
          # system voice instead of playing a wrong one.
          for n in $(cat voice-samples/report-*.tsv | awk -F'\t' '$3=="FAILED"{print $1}'); do
            rm -f "mobile/assets/voice/$(printf 'count-%03d.m4a' "$n")"
          done
          cat voice-samples/report-*.tsv >> voice-samples/counts-report.tsv && rm -f voice-samples/report-*.tsv
          grep -c FAILED voice-samples/counts-report.tsv || true
          cd mobile
          {
            echo "// Generated by .github/workflows/voice-counts.yml — recorded counts 1-200."
            echo "// Voice: Chatterbox Multilingual (MIT) cloned from Zeroth Korean speaker 116 (CC BY 4.0)."
            echo "export const COUNT_CLIPS: Record<number, number> = {"
            for f in $(ls assets/voice/count-*.m4a | sort); do
              n=$(basename "$f" .m4a | sed 's/count-0*//')
              echo "  $n: require('../../../assets/voice/$(basename "$f")'),"
            done
            echo "};"
          } > src/features/voice/counts.ts
          ls assets/voice | wc -l
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/assets/voice mobile/src/features/voice/counts.ts voice-samples
          git diff --cached --quiet && exit 0
          git commit -m "Recorded rep counts 1-200 (recorded in runs of ten)"
          git pull --rebase origin main
          git push origin HEAD:main
