# Publishes site/ (landing page + privacy policy) to GitHub Pages:
#   https://hwanify.github.io/hagobwa/          landing
#   https://hwanify.github.io/hagobwa/privacy/  privacy policy
# One-time setup: repo Settings > Pages > Source: "GitHub Actions".
name: 웹사이트 배포 (GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
