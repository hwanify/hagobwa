# Ship the iOS app on every push to main (or by hand).
#
# Decides automatically:
#   - native code changed (new library, app.json native config, ...) -> EAS build + TestFlight
#   - only JS/TS/assets changed                                        -> OTA update (EAS Update), no review, no new build
#
# The decision uses the project fingerprint: if a finished production build with the same
# fingerprint exists, an OTA update is compatible with it.
name: iOS 배포 (자동 빌드/OTA)

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/ios-release.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto = 필요할 때만 빌드, build = 무조건 TestFlight 빌드, update = 무조건 OTA'
        type: choice
        options: [auto, build, update]
        default: auto

permissions:
  contents: read

concurrency:
  group: ios-eas
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      EXPO_APPLE_TEAM_TYPE: ${{ vars.APPLE_TEAM_TYPE || 'INDIVIDUAL' }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      ASC_APP_ID: ${{ vars.ASC_APP_ID }}
      MODE: ${{ inputs.mode || 'auto' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check setup
        run: |
          if ! jq -e '.expo.extra.eas.projectId' app.json >/dev/null; then
            echo "::error::EAS project is not linked yet. Run the 'iOS 1회 설정 (EAS)' workflow first."
            exit 1
          fi
          if [ -z "$ASC_APP_ID" ]; then
            ASC_APP_ID=$(jq -r '.submit.production.ios.ascAppId // empty' eas.json)
            echo "ASC_APP_ID=$ASC_APP_ID" >> "$GITHUB_ENV"
          fi
          if [ -z "$ASC_APP_ID" ]; then
            echo "::error::ASC_APP_ID is missing (App Store Connect > 앱 > 앱 정보 > Apple ID). See docs/IOS_TESTFLIGHT.md"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Write App Store Connect API key
        run: |
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc_key.p8"
          echo "EXPO_ASC_API_KEY_PATH=$RUNNER_TEMP/asc_key.p8" >> "$GITHUB_ENV"

      - name: Decide build or OTA
        id: decide
        run: |
          if [ "$MODE" = "build" ] || [ "$MODE" = "update" ]; then
            echo "kind=$MODE" >> "$GITHUB_OUTPUT"
            echo "Forced: $MODE"
            exit 0
          fi
          HASH=$(npx eas-cli fingerprint:generate --platform ios --build-profile production --json --non-interactive | jq -r '.hash')
          echo "Fingerprint: $HASH"
          COUNT=$(npx eas-cli build:list --platform ios --status finished --build-profile production \
                    --fingerprint-hash "$HASH" --limit 1 --json --non-interactive | jq 'length')
          if [ "${COUNT:-0}" -gt 0 ]; then
            echo "kind=update" >> "$GITHUB_OUTPUT"
            echo "A build with this fingerprint exists -> OTA update"
          else
            echo "kind=build" >> "$GITHUB_OUTPUT"
            echo "Native code changed (no build with this fingerprint) -> new build"
          fi

      - name: OTA update (EAS Update)
        if: steps.decide.outputs.kind == 'update'
        run: |
          MSG="$(git log -1 --pretty=%s)"
          npx eas-cli update --channel production --platform ios --environment production \
            --message "$MSG" --non-interactive
          echo "### OTA 업데이트 배포 완료: $MSG" >> "$GITHUB_STEP_SUMMARY"
          echo "앱을 껐다 켜면 적용돼요." >> "$GITHUB_STEP_SUMMARY"

      - name: Build on EAS (iOS, production)
        if: steps.decide.outputs.kind == 'build'
        run: npx eas-cli build --platform ios --profile production --non-interactive

      - name: Add TestFlight submit profile
        if: steps.decide.outputs.kind == 'build'
        run: |
          jq --arg app "$ASC_APP_ID" --arg path "$RUNNER_TEMP/asc_key.p8" \
             --arg kid "$EXPO_ASC_KEY_ID" --arg iss "$EXPO_ASC_ISSUER_ID" \
             '.submit.production.ios += {ascAppId: $app, ascApiKeyPath: $path, ascApiKeyId: $kid, ascApiKeyIssuerId: $iss}' \
             eas.json > eas.tmp.json && mv eas.tmp.json eas.json

      - name: Upload to TestFlight
        if: steps.decide.outputs.kind == 'build'
        run: |
          npx eas-cli submit --platform ios --profile production --latest --non-interactive
          echo "### 새 빌드를 TestFlight에 올렸어요" >> "$GITHUB_STEP_SUMMARY"
          echo "애플 처리 후 TestFlight 앱에서 업데이트하세요." >> "$GITHUB_STEP_SUMMARY"
