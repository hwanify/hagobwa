# Ship the iOS app on every push to main (or by hand).
#
# Decides automatically:
#   - native code changed (new library, app.json native config, ...) -> EAS build + TestFlight
#   - only JS/TS/assets changed                                        -> OTA update (EAS Update), no review, no new build
#
# The decision uses the project fingerprint: if a finished production build with the same
# fingerprint exists, an OTA update is compatible with it.
name: iOS 배포 (자동 빌드/OTA)

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/ios-release.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto = 필요할 때만 빌드, build = 무조건 TestFlight 빌드, update = 무조건 OTA'
        type: choice
        options: [auto, build, update]
        default: auto

permissions:
  contents: read

concurrency:
  group: ios-eas
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      kind: ${{ steps.decide.outputs.kind }}
      hash: ${{ steps.fp.outputs.hash }}
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      EXPO_APPLE_TEAM_TYPE: ${{ vars.APPLE_TEAM_TYPE || 'INDIVIDUAL' }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      ASC_APP_ID: ${{ vars.ASC_APP_ID }}
      MODE: ${{ inputs.mode || 'auto' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check setup
        run: |
          if ! jq -e '.expo.extra.eas.projectId' app.json >/dev/null; then
            echo "::error::EAS project is not linked yet. Run the 'iOS 1회 설정 (EAS)' workflow first."
            exit 1
          fi
          if [ -z "$ASC_APP_ID" ]; then
            ASC_APP_ID=$(jq -r '.submit.production.ios.ascAppId // empty' eas.json)
            echo "ASC_APP_ID=$ASC_APP_ID" >> "$GITHUB_ENV"
          fi
          if [ -z "$ASC_APP_ID" ]; then
            echo "::error::ASC_APP_ID is missing (App Store Connect > 앱 > 앱 정보 > Apple ID). See docs/IOS_TESTFLIGHT.md"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Write App Store Connect API key
        run: |
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc_key.p8"
          echo "EXPO_ASC_API_KEY_PATH=$RUNNER_TEMP/asc_key.p8" >> "$GITHUB_ENV"

      - name: Share Apple Team ID with EAS (Screen Time extensions sign with it)
        run: |
          npx eas-cli env:set production --name APPLE_TEAM_ID --value "$EXPO_APPLE_TEAM_ID" \
            --visibility sensitive --scope project --non-interactive \
            || npx eas-cli env:create production --name APPLE_TEAM_ID --value "$EXPO_APPLE_TEAM_ID" \
                 --visibility sensitive --force --non-interactive

      # Family Controls (Distribution) is enabled by hand on developer.apple.com: Apple's API
      # can't set it and reports it under a type eas-cli doesn't know, so eas-cli would keep trying
      # (and fail) to turn it on. Drop that one entry from eas-cli's capability sync; App Groups etc.
      # still sync automatically.
      - name: Skip Family Controls in eas-cli capability sync
        run: |
          for f in $(find ~/.npm/_npx -path '*eas-cli/build/credentials/ios/appstore/capabilityList.js'); do
            node -e '
              const fs = require("fs"); const f = process.argv[1];
              let s = fs.readFileSync(f, "utf8");
              const re = /\{\s*name: .Family Controls.,[\s\S]*?getSyncOperation: getBooleanSyncOperation,\s*\},/;
              if (!re.test(s)) { console.log("already patched or changed:", f); process.exit(0); }
              fs.writeFileSync(f, s.replace(re, "")); console.log("patched", f);
            ' "$f"
          done

      - name: Fingerprint of the native project
        id: fp
        run: |
          HASH=$(npx eas-cli fingerprint:generate --platform ios --build-profile production --json --non-interactive | jq -r '.hash')
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "Fingerprint: $HASH"

      # Builds now run on GitHub's Mac (not EAS servers), so EAS doesn't list them.
      # A cache entry per fingerprint records "a TestFlight build exists for this native code".
      - name: Was this native code already built here?
        id: built
        uses: actions/cache/restore@v4
        with:
          path: mobile/.built-marker
          key: ios-built-${{ steps.fp.outputs.hash }}
          lookup-only: true

      - name: Decide build or OTA
        id: decide
        env:
          HASH: ${{ steps.fp.outputs.hash }}
          BUILT_HERE: ${{ steps.built.outputs.cache-hit }}
        run: |
          if [ "$MODE" = "build" ] || [ "$MODE" = "update" ]; then
            echo "kind=$MODE" >> "$GITHUB_OUTPUT"
            echo "Forced: $MODE"
            exit 0
          fi
          # Only builds that went through this workflow count: an EAS build that was never
          # uploaded to TestFlight must not make us ship an OTA nobody's app can load.
          if [ "$BUILT_HERE" = "true" ]; then
            echo "kind=update" >> "$GITHUB_OUTPUT"
            echo "A build with this fingerprint exists -> OTA update"
          else
            echo "kind=build" >> "$GITHUB_OUTPUT"
            echo "Native code changed (no build with this fingerprint) -> new build"
          fi

      - name: OTA update (EAS Update)
        if: steps.decide.outputs.kind == 'update'
        run: |
          MSG="$(git log -1 --pretty=%s)"
          npx eas-cli update --channel production --platform ios --environment production \
            --message "$MSG" --non-interactive
          echo "### OTA 업데이트 배포 완료: $MSG" >> "$GITHUB_STEP_SUMMARY"
          echo "앱을 껐다 켜면 적용돼요." >> "$GITHUB_STEP_SUMMARY"

      - name: Signing for app + extensions (creates missing profiles, syncs capabilities)
        if: steps.decide.outputs.kind == 'build'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq expect
          env -u CI expect scripts/eas-ios-credentials.exp

  # Builds on GitHub's macOS runner (free for public repos) instead of EAS servers, so the
  # EAS build quota doesn't apply. Signing credentials still come from EAS.
  build-ios:
    needs: release
    if: needs.release.outputs.kind == 'build'
    runs-on: macos-26
    timeout-minutes: 120
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      EXPO_APPLE_TEAM_TYPE: ${{ vars.APPLE_TEAM_TYPE || 'INDIVIDUAL' }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      # Expo SDK 58's native code (expo-modules-jsi, Swift 6 mode) needs Xcode 27 / Swift 6.4,
      # like EAS's own build image; Xcode 26.x fails with "sending 'slot' risks causing data races".
      - name: Pick Xcode 27
        run: |
          ls -d /Applications/Xcode_*.app
          XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          [ -n "$XCODE" ] || XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode 27 on this runner image."
            exit 1
          fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      - name: App Store Connect API key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${EXPO_ASC_KEY_ID}.p8
          echo "EXPO_ASC_API_KEY_PATH=$HOME/.appstoreconnect/private_keys/AuthKey_${EXPO_ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Skip Family Controls in eas-cli capability sync
        run: |
          npx eas-cli --version
          for f in $(find ~/.npm/_npx -path '*eas-cli/build/credentials/ios/appstore/capabilityList.js'); do
            node -e '
              const fs = require("fs"); const f = process.argv[1];
              let s = fs.readFileSync(f, "utf8");
              const re = /\{\s*name: .Family Controls.,[\s\S]*?getSyncOperation: getBooleanSyncOperation,\s*\},/;
              if (!re.test(s)) { console.log("already patched or changed:", f); process.exit(0); }
              fs.writeFileSync(f, s.replace(re, "")); console.log("patched", f);
            ' "$f"
          done

      - name: Build the app on this Mac (eas build --local)
        run: |
          npx eas-cli build --platform ios --profile production --local --non-interactive \
            --output "$RUNNER_TEMP/hagobwa.ipa"

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app --type ios --file "$RUNNER_TEMP/hagobwa.ipa" \
            --apiKey "$EXPO_ASC_KEY_ID" --apiIssuer "$EXPO_ASC_ISSUER_ID"
          echo "### 새 빌드를 TestFlight에 올렸어요 (GitHub Mac에서 빌드)" >> "$GITHUB_STEP_SUMMARY"
          echo "애플 처리 후 TestFlight 앱에서 업데이트하세요." >> "$GITHUB_STEP_SUMMARY"

      - name: Remember this native code is built
        run: echo "${{ needs.release.outputs.hash }}" > .built-marker

      - uses: actions/cache/save@v4
        with:
          path: mobile/.built-marker
          key: ios-built-${{ needs.release.outputs.hash }}
