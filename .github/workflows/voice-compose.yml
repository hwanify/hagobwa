# Fills in counts that have no recorded clip by joining verified clips:
#   쉰하나 = "쉰" (50) + "하나" (1),  백스물하나 = "백" (100) + "스물하나" (21)
# The voice model mispronounces long numbers, but says the short words clearly.
name: 구령 음성 이어붙이기

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/voice-compose.yml'

permissions:
  contents: write

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Join missing counts
        run: |
          mkdir -p work
          python3 - <<'PY'
          import os, subprocess
          D = "mobile/assets/voice"
          f = lambda n: f"{D}/count-{n:03d}.m4a"
          have = lambda n: os.path.exists(f(n))
          def trimmed(n):
              out = f"work/t{n:03d}.wav"
              if not os.path.exists(out):
                  # Cut the silence around the word so the two halves run together.
                  subprocess.run(["ffmpeg", "-loglevel", "error", "-y", "-i", f(n), "-af",
                      "silenceremove=start_periods=1:start_threshold=-40dB,areverse,silenceremove=start_periods=1:start_threshold=-40dB,areverse",
                      "-ac", "1", "-ar", "24000", out], check=True)
              return out
          made = []
          for n in range(11, 100):  # 100+ use the system voice
              if have(n) or n % 10 == 0:
                  continue
              parts = [n // 10 * 10, n % 10]
              if not all(have(p) for p in parts):
                  print(n, "skip: needs", [p for p in parts if not have(p)])
                  continue
              a, b = (trimmed(p) for p in parts)
              subprocess.run(["ffmpeg", "-loglevel", "error", "-y", "-i", a, "-i", b, "-filter_complex",
                  "[0][1]acrossfade=d=0.025:c1=tri:c2=tri,apad=pad_dur=0.03,loudnorm=I=-14:TP=-1",
                  "-ac", "1", "-ar", "24000", "-c:a", "aac", "-b:a", "64k", f(n)], check=True)
              made.append(n)
          print("joined:", len(made), made)
          with open("voice-samples/composed.txt", "a") as fh:
              for n in made:
                  fh.write(f"{n}\n")
          PY
      - name: Write counts.ts and commit
        run: |
          cd mobile
          {
            echo "// Generated by .github/workflows/voice-counts.yml — recorded counts 1-99 (100+ use the system voice)."
            echo "// Voice: Chatterbox Multilingual (MIT) cloned from Zeroth Korean speaker 116 (CC BY 4.0)."
            echo "export const COUNT_CLIPS: Record<number, number> = {"
            for f in $(ls assets/voice/count-*.m4a | sort); do
              n=$(basename "$f" .m4a | sed 's/count-0*//')
              echo "  $n: require('../../../assets/voice/$(basename "$f")'),"
            done
            echo "};"
          } > src/features/voice/counts.ts
          ls assets/voice | wc -l
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/assets/voice mobile/src/features/voice/counts.ts voice-samples
          git diff --cached --quiet && exit 0
          git commit -m "Voice counts: join missing ones from verified clips"
          git pull --rebase origin main
          git push origin HEAD:main
